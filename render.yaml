# Render blueprint — a stable public URL for the Command Center.
#
# The quick tunnel we used for testing dies with the laptop and changes address
# on every restart, which is no good for a submitted link. This runs the same
# three containers on Render instead: Postgres, the FastAPI backend, and the
# Next.js frontend.
#
# Deploy: push this repo to your own GitHub account, then point Render at it
# (New → Blueprint). Set SUPERVITY_API_KEY by hand in the dashboard — it is
# marked sync:false below so it never lands in the repo.
#
# See DEPLOY.md for the step-by-step.

databases:
  - name: autopilot-db
    databaseName: autopilot
    user: autopilot
    plan: free

services:
  # --- Backend: FastAPI, mirrors agent activity from Supervity Auto ----------
  - type: web
    name: autopilot-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autopilot-db
          property: connectionString
      - key: SUPERVITY_API_KEY
        # Set this in the Render dashboard. Never commit it.
        sync: false
      - key: SUPERVITY_BASE_URL
        value: https://auto-workflow-api.supervity.ai
      - key: AUTH_BYPASS
        value: "true"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Locked down once the frontend URL is known — see DEPLOY.md step 5.
      - key: FRONTEND_URL
        sync: false

  # --- Frontend: the Command Center itself -----------------------------------
  # NEXT_PUBLIC_API_URL is deliberately empty: the browser calls the frontend's
  # own origin and next.config.ts rewrites /api/* to INTERNAL_API_URL. That
  # keeps the backend off the public internet as far as the browser is
  # concerned, and avoids a CORS round trip on every request.
  - type: web
    name: autopilot-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: INTERNAL_API_URL
        # The backend's Render URL — set in the dashboard once it exists.
        sync: false
      - key: NEXTAUTH_URL
        # This service's own public URL. Set in the dashboard after first deploy.
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
